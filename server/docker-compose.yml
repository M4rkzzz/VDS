services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vds-signaling
    ports:
      - "3000:3000"
      - "127.0.0.1:3010:3010"
    restart: unless-stopped
    environment:
      PORT: 3000
      ADMIN_PORT: 3010
      ADMIN_HOST: 0.0.0.0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DISCONNECT_GRACE_MS: 30000
